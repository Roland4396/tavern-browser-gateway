server {
    listen 8080;
    server_name _;
    server_tokens off;

    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 30s;
    proxy_set_header Host stream-proxy;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-API-Key $http_x_api_key;
    proxy_set_header X-Goog-API-Key $http_x_goog_api_key;
    proxy_set_header Anthropic-Version $http_anthropic_version;
    proxy_set_header Anthropic-Beta $http_anthropic_beta;

    location = /_health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /shell/intercept.js {
        root /usr/share/nginx/html;
        default_type application/javascript;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location = /v1/models {
        limit_except GET { deny all; }
        proxy_pass http://stream-proxy:3002;
    }

    location = /v1/chat/completions {
        limit_except POST { deny all; }
        proxy_pass http://stream-proxy:3002;
    }

    location = /v1/messages {
        limit_except POST { deny all; }
        proxy_pass http://stream-proxy:3002;
    }

    location = /v1/audio/speech {
        limit_except POST { deny all; }
        proxy_pass http://stream-proxy:3002;
    }

    location = /v1/audio/voices {
        limit_except GET { deny all; }
        proxy_pass http://stream-proxy:3002;
    }

    location / {
        return 404;
    }
}
